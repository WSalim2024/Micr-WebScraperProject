<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Scraper Project</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 40px; background-color: #f4f7f6; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        input[type="text"] { width: 80%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 12px 25px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2980b9; }
        textarea { width: 100%; height: 300px; margin-top: 20px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Data Scraper Tool</h1>
        <p><em>Forward-thinking data extraction for IT Support and Research.</em></p>

        <form method="POST">
            <input type="text" name="url_input" placeholder="Paste your link here (e.g., https://example.com)" value="{{ url }}" required>
            <button type="submit">Scrape Text</button>
        </form>

        <label for="output">Scraped Content:</label>
        <textarea id="output" readonly>{{ content }}</textarea>
    </div>
</body>
</html>
