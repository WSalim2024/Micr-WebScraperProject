<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Micr-WebScraper Professional</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 40px; }
        .app-container { max-width: 900px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { color: var(--primary); margin-top: 0; font-weight: 700; }
        .input-group { display: flex; gap: 10px; margin-bottom: 25px; }
        input[type="text"] { flex-grow: 1; padding: 12px; border: 2px solid #ddd; border-radius: 6px; outline: none; transition: border-color 0.3s; }
        input[type="text"]:focus { border-color: var(--accent); }
        button { background: var(--accent); color: white; border: none; padding: 12px 25px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .output-label { display: block; margin-bottom: 10px; font-weight: bold; color: var(--primary); }
        textarea { width: 100%; height: 450px; border: 1px solid #ddd; border-radius: 6px; padding: 15px; font-family: 'Courier New', monospace; font-size: 13px; background: #fafafa; line-height: 1.6; }
        .footer-note { margin-top: 20px; font-size: 12px; color: #7f8c8d; }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>Micr-WebScraper Pro</h1>
        <p><em>Advanced Data Acquisition & Sanitization Engine</em></p>

        <form method="POST">
            <div class="input-group">
                <input type="text" name="url_input" placeholder="Enter target URL (e.g., Wikipedia page with tables)..." value="{{ url }}" required>
                <button type="submit">Execute Scrape</button>
            </div>
        </form>

        <label class="output-label">Sanitized Output:</label>
        <textarea readonly placeholder="Awaiting input data...">{{ content }}</textarea>

        <div class="footer-note">
            <strong>Compliance Note:</strong> This agent enforces a 1s delay and mimics a standard browser header to ensure ethical data collection.
        </div>
    </div>
</body>
</html>
