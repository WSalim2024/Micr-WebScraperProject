<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Micr-WebScraper Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 40px; }
        .card { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        input[type="text"] { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #ddd; }
        .btn-text { background: #3498db; color: white; }
        .btn-docs { background: #2ecc71; color: white; }
        button { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; flex: 1; }
        textarea { width: 100%; height: 350px; margin-top: 20px; padding: 15px; border-radius: 6px; border: 1px solid #ddd; background: #f9f9f9; }
        .tab-indicator { margin-top: 10px; font-size: 0.9em; color: #666; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Micr-WebScraper Pro</h1>
        <form method="POST">
            <input type="text" name="url_input" placeholder="Paste URL here..." value="{{ url }}" required>
            <div class="btn-group">
                <button type="submit" class="btn-text" formaction="/scrape_text">Scrape Text</button>
                <button type="submit" class="btn-docs" formaction="/fetch_docs">Fetch Documents</button>
            </div>
        </form>

        {% if active_tab %}
        <div class="tab-indicator">Showing results for: <strong>{{ active_tab.upper() }}</strong></div>
        {% endif %}

        <textarea readonly>{{ content }}</textarea>
    </div>
</body>
</html>
